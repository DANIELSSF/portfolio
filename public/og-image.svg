<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111111"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0070f3"/>
      <stop offset="100%" style="stop-color:#00a6f3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Accent glow -->
  <circle cx="200" cy="315" r="300" fill="#0070f3" opacity="0.04"/>

  <!-- Top border accent -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Content -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#ededed">
    Daniel Santiago
  </text>
  <text x="80" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#a1a1aa">
    Silva Fonseca
  </text>

  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#0070f3">
    Full Stack Engineer
  </text>

  <text x="80" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#71717a">
    Node.js · NestJS · TypeScript · Go · GCP · AWS
  </text>

  <!-- Terminal icon -->
  <rect x="900" y="200" width="220" height="160" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="922" cy="222" r="5" fill="#ff5f57"/>
  <circle cx="940" cy="222" r="5" fill="#febc2e"/>
  <circle cx="958" cy="222" r="5" fill="#28c840"/>
  <text x="920" y="270" font-family="monospace" font-size="14" fill="#0070f3">❯</text>
  <text x="940" y="270" font-family="monospace" font-size="14" fill="#a1a1aa">whoami</text>
  <text x="920" y="295" font-family="monospace" font-size="13" fill="#4ade80">daniel.dev</text>
  <text x="920" y="325" font-family="monospace" font-size="14" fill="#0070f3">❯</text>
  <rect x="940" y="314" width="8" height="14" fill="#a1a1aa" opacity="0.6"/>

  <!-- Bottom info -->
  <text x="80" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#525252">
    danielssf.dev
  </text>
</svg>
